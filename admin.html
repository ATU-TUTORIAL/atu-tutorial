<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tutor Registrations</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">🛠️ Admin Dashboard: Tutor Registrations</h1>
            <a href="/" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Back to Home</a>
        </div>

        <!-- Tutor Registrations Section -->
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">All Tutor Submissions</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Parent Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Children Count</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Grades</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        </tr>
                    </thead>
                    <tbody id="registrationsTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- JavaScript will fill this -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript to Fetch Data -->
    <script>
        async function fetchAdminData() {
            try {
                const regRes = await fetch('/api/admin/registrations');
                const registrations = await regRes.json();
                
                const regTableBody = document.getElementById('registrationsTableBody');
                regTableBody.innerHTML = '';
                
                if (registrations.length === 0) {
                    regTableBody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No tutor registrations found</td></tr>`;
                } else {
                    registrations.forEach(reg => {
                        regTableBody.innerHTML += `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${reg.id}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${reg.parent_name}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${reg.phone}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${reg.children_count}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${reg.child_grades}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${reg.registered_at || 'N/A'}</td>
                            </tr>
                        `;
                    });
                }

            } catch (error) {
                console.error('Error fetching admin registrations:', error);
            }
        }

        fetchAdminData();
    </script>
</body>
</html>
